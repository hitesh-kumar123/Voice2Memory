name: voice2memory
region: nyc
services:
  - name: web
    dockerfilePath: Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: hitesh-kumar123/Voice2Memory
    http_port: 3000
    instance_count: 1
    instance_size_slug: professional-xs
    envs:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: ${MONGODB_URI} # MongoDB Atlas Connection String
        type: SECRET
      - key: OLLAMA_BASE_URL
        value: ${OLLAMA_BASE_URL} # DigitalOcean GPU Droplet or local Ollama URL
      - key: OLLAMA_MODEL
        value: gemma2:2b
      - key: ELEVENLABS_API_KEY
        value: ${ELEVENLABS_API_KEY}
        type: SECRET
    routes:
      - path: /
